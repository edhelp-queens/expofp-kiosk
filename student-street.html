<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duncan McArthur Hall Map - Student Street</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    .hero {
      flex: 0 0 30vh;
      background-image: url("DunMac.png");
      background-size: contain;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-color: #000;
    }

    .map-wrap {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }

    .map-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
     .clock {
  position: absolute;

  top: calc(30vh - 86px);
  right: 40px;

  z-index: 9999;

  width: 235px;
  height: 78px;

  overflow: hidden;

  border-radius: 12px;

  background: #ffffff;

  display: flex;
  align-items: center;
  justify-content: center;

  box-sizing: border-box;
}

.clock iframe {
  width: 215px;
  height: 70px;

  border: 0;

  display: block;

  margin: 0;

  position: relative;
  top: 13px;
}
  </style>
</head>

<body>
  <div class="page">
    <div class="hero"></div>

    <div class="map-wrap">
     <iframe
  src="https://duncanmcarthurhall.expofp.com/?k=1&centerxy=2750.380859375%2C1930.9798583984375&z=Level1&bearing=&zoom=0.9"
  allow="clipboard-read; clipboard-write">
</iframe>
    </div>
  </div>
</body>
</html>
